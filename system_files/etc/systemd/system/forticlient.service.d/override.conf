# fctsched grava estado em runtime no caminho fixo /opt/forticlient/data
# (que resolve pra /usr/lib/forticlient/data — imutável, ver 41-forticlient-fix.sh).
# Sem isso, mkdir da "data/" bate EROFS e o serviço cai em crash loop.
#
# TemporaryFileSystem + BindReadOnlyPaths: recria a view do diretório num
# tmpfs privado do serviço, com o conteúdo original (binário/recursos) só-leitura.
# StateDirectory + BindPaths: monta um subdiretório gravável e persistente
# (/var/lib/forticlient) por cima de data/, dentro desse mesmo namespace.
[Service]
TemporaryFileSystem=/usr/lib/forticlient:ro
BindReadOnlyPaths=/usr/lib/forticlient
StateDirectory=forticlient
BindPaths=/var/lib/forticlient:/usr/lib/forticlient/data
