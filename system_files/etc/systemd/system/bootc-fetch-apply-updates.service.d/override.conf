# Anti-reboot automático do bootc.
# Por padrão o serviço aplica updates E reinicia. Aqui trocamos a ação por
# apenas 'bootc upgrade --quiet' (baixa/aplica em staging) SEM reiniciar.
# O usuário decide quando reiniciar (ver bootc-notify.sh).
[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
